name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
      env:
        HOME: /root

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Configure Android build
        shell: bash
        env:
          ANDROID_HOME: /usr/lib/android-sdk
          ANDROID_SDK_ROOT: /usr/lib/android-sdk
          JAVA_HOME: /opt/java/openjdk
        run: |
          set -e

          export ANDROID_HOME="/usr/lib/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/33.0.2:$PATH"

          mkdir -p /root/.config/godot
          cat > /root/.config/godot/editor_settings-4.tres <<'EOF'
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "/usr/lib/android-sdk"
export/android/debug_keystore = "/root/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF

          mkdir -p build

      - name: Prepare project
        shell: bash
        run: godot --headless --editor --path . --quit

      - name: Build Android APK
        shell: bash
        env:
          ANDROID_HOME: /usr/lib/android-sdk
          ANDROID_SDK_ROOT: /usr/lib/android-sdk
          JAVA_HOME: /opt/java/openjdk
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -e
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/33.0.2:$PATH"

          java -version
          godot --version
          ls -la /root/debug.keystore
          ls -la "$ANDROID_HOME/build-tools/33.0.2"

          godot --headless --verbose --path . --export-debug "Android" build/UltimatePartyBattle.apk

      - name: Verify APK
        shell: bash
        run: |
          test -s build/UltimatePartyBattle.apk
          ls -lh build/UltimatePartyBattle.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UltimatePartyBattle-Android-APK
          path: build/UltimatePartyBattle.apk
          if-no-files-found: error
          retention-days: 7
