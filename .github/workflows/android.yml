
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare project
        run: |
          godot --headless --editor --path . --quit

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/UltimatePartyBattle.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UltimatePartyBattle-APK
          path: build/UltimatePartyBattle.apk
          retention-days: 7
